name: Flutter
description: >-
  Installs Flutter with subosito/flutter-action and caches the SDK and the pub cache under the keys that action computes.
  The caching is done here with actions/cache pinned by SHA: flutter-action's own `cache: true` calls actions/cache by a
  moving tag, which would run unpinned code in every job that uses it, the signing job too.

inputs:
  flutter-version:
    description: The Flutter version
    required: true

runs:
  using: composite
  steps:
    # Only the outputs (cache paths and keys); nothing is installed or cached by flutter-action itself
    - id: keys
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        flutter-version: ${{ inputs.flutter-version }}
        channel: stable
        dry-run: true

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.keys.outputs.CACHE-PATH }}
        key: ${{ steps.keys.outputs.CACHE-KEY }}

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.keys.outputs.PUB-CACHE-PATH }}
        key: ${{ steps.keys.outputs.PUB-CACHE-KEY }}-${{ hashFiles('**/pubspec.lock') }}

    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        flutter-version: ${{ inputs.flutter-version }}
        channel: stable
        cache: false
        pub-cache: false
