name: Gradle cache
description: >-
  Restores and saves the Gradle User Home (dependencies, wrapper, build cache) by the hash of the Gradle files.
  A miss restores a cache with the same prefix if the run can see one (its own ref first, then the base and the default
  branch), so a change to the Gradle files usually starts from an earlier cache; with none it starts empty
  (setup-java's cache: gradle has no such fallback).

runs:
  using: composite
  steps:
    - uses: actions/cache@v6
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ hashFiles('android/*.gradle.kts', 'android/app/build.gradle.kts', 'android/gradle.properties', 'android/gradle/wrapper/gradle-wrapper.properties') }}
        restore-keys: gradle-${{ runner.os }}-
