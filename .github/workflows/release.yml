name: Release

# Manual run (Actions → Release → Run workflow or `gh workflow run release.yml`).
# Builds the pubspec.yaml version: teapod-core AAR from core/ (cached by its tree hash) → one APK per ABI in parallel
# jobs → GitHub Release. The release also carries the AAR as teapod-core-<core/ tree hash>.aar for ./build.sh binaries.
on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Pre-release
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.50.0
  NDK_VERSION: 30.0.16248370
  # SHA-256 of the original signing certificate (the debug key Gradle signs with; every release before the rotation)
  CERT_SHA256: 1a9d47fabd88aacda435d2ae0098cf3f0666358113da858a974b2483fdd5eaaf
  # SHA-256 of the release key the APKs are signed with since the v3 key rotation (.github/signing/teapod.lineage
  # proves it succeeds the one above, so installed versions update)
  RELEASE_CERT_SHA256: cbfb34bc6830f055d17782b050039ba23d8e1d0cb79b3bc5924cba0dbadf818a

jobs:
  apk:
    name: apk (${{ matrix.abi }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      matrix:
        include:
          - abi: arm64-v8a
            platform: android-arm64
          - abi: x86_64
            platform: android-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE" ] || { echo "::error::Missing secret DEBUG_KEYSTORE_BASE64"; exit 1; }
          # Without ANDROID_USER_HOME AGP on the runner uses ~/.config/.android and generates a new key
          dir="$HOME/.android"
          echo "ANDROID_USER_HOME=$dir" >> "$GITHUB_ENV"
          mkdir -p "$dir"
          echo "$KEYSTORE" | base64 -d > "$dir/debug.keystore"
          fp=$(keytool -list -v -keystore "$dir/debug.keystore" -storepass android -alias androiddebugkey \
            | awk '/SHA256:/{print $2}' | tr -d ':' | tr 'A-F' 'a-f')
          [ "$fp" = "$CERT_SHA256" ] || { echo "::error::DEBUG_KEYSTORE_BASE64 — wrong key: '$fp'"; exit 1; }

      - name: Release key
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          [ -n "$KEYSTORE" ] && [ -n "$RELEASE_KEYSTORE_PASSWORD" ] \
            || { echo "::error::Missing secret RELEASE_KEYSTORE_BASE64 or RELEASE_KEYSTORE_PASSWORD"; exit 1; }
          ks="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE" | base64 -d > "$ks"
          echo "RELEASE_KEYSTORE=$ks" >> "$GITHUB_ENV"
          fp=$(keytool -list -v -keystore "$ks" -storepass:env RELEASE_KEYSTORE_PASSWORD -alias teapod \
            | awk '/SHA256:/{print $2}' | tr -d ':' | tr 'A-F' 'a-f')
          [ "$fp" = "$RELEASE_CERT_SHA256" ] || { echo "::error::RELEASE_KEYSTORE_BASE64 — wrong key: '$fp'"; exit 1; }

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      - uses: ./.github/actions/gradle-cache

      - name: Android NDK
        run: |
          [ -d "$ANDROID_HOME/ndk/$NDK_VERSION" ] \
            || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null

      # On a cache miss both jobs build the same AAR; one of them saves it for the publish job
      - uses: ./.github/actions/teapod-core
        with:
          ndk-version: ${{ env.NDK_VERSION }}

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build APK
        env:
          TARGET_PLATFORMS: ${{ matrix.platform }}
        run: |
          ./build.sh binaries
          ./build.sh release

      # Gradle signs with the original key; the APK is signed again with the rotation: v3 by the release key with the
      # lineage (original → release), which Android 9+ (minSdk is 29) accepts as an update of the original signature
      - name: Sign with the release key
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          signer="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          apks=(build/app/outputs/flutter-apk/teapod-stream-${{ matrix.abi }}-release-*.apk)
          [ -f "${apks[0]}" ] || { echo "::error::No ${{ matrix.abi }} APK"; exit 1; }
          for apk in "${apks[@]}"; do
            "$signer" sign \
              --ks "$HOME/.android/debug.keystore" --ks-pass pass:android --ks-key-alias androiddebugkey \
              --next-signer --ks "$RELEASE_KEYSTORE" --ks-pass env:RELEASE_KEYSTORE_PASSWORD --ks-key-alias teapod \
              --lineage .github/signing/teapod.lineage --rotation-min-sdk-version 28 \
              --out "$apk.signed" "$apk"
            mv "$apk.signed" "$apk"
          done
          rm -f "$RELEASE_KEYSTORE"

      - name: Verify signature
        run: |
          signer="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          apks=(build/app/outputs/flutter-apk/teapod-stream-${{ matrix.abi }}-release-*.apk)
          [ -f "${apks[0]}" ] || { echo "::error::No ${{ matrix.abi }} APK"; exit 1; }
          for apk in "${apks[@]}"; do
            # Signed by the release key, and its lineage starts with the original certificate
            out=$("$signer" verify -v --print-certs "$apk")
            lineage=$("$signer" lineage --in "$apk" --print-certs)
            grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" <<< "$out" \
              && grep -q "Signer #1 certificate SHA-256 digest: $RELEASE_CERT_SHA256" <<< "$out" \
              && grep -q "Signer #1 in lineage certificate SHA-256 digest: $CERT_SHA256" <<< "$lineage" \
              && grep -q "Signer #2 in lineage certificate SHA-256 digest: $RELEASE_CERT_SHA256" <<< "$lineage" || {
              echo "$out"; echo "$lineage"
              echo "::error::$apk is not signed with the release key and its lineage"; exit 1
            }
          done

      # Paths are kept relative to build/app/outputs: flutter-apk/… and symbols/…
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.abi }}
          path: |
            build/app/outputs/flutter-apk/teapod-stream-${{ matrix.abi }}-release-*.apk
            build/app/outputs/symbols
          if-no-files-found: error
          retention-days: 1

      # The AAR the APKs were built with, for the release; the same core/ tree in both jobs, so one copy
      - if: matrix.abi == 'arm64-v8a'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: teapod-core
          path: core/outputs/teapod-core-*.aar
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Version
        id: ver
        run: echo "version=$(awk '/^version:/{split($2,a,"+"); print a[1]; exit}' pubspec.yaml)" >> "$GITHUB_OUTPUT"

      # By name: a missing ABI fails here instead of publishing a release without it
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-arm64-v8a
          path: build/app/outputs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-x86_64
          path: build/app/outputs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: teapod-core
          path: core/outputs

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          PRE: ${{ inputs.prerelease }}
        run: ./build.sh "$([ "$PRE" = true ] && echo pushpre || echo push)"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: symbols-${{ steps.ver.outputs.version }}
          path: build/app/outputs/symbols
