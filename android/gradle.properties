org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official
# The Flutter Gradle plugin needs AGP's old DSL
android.newDsl=false
# AGP compiles Kotlin itself (no kotlin-android plugin); every Flutter plugin must support it.
# The Kotlin version comes from org.jetbrains.kotlin.android in settings.gradle.kts.
# A checkout with an older pubspec.lock (shared_preferences_android < 2.5 applies kotlin-android) fails with
# "The 'org.jetbrains.kotlin.android' plugin is no longer required": run `flutter pub upgrade`.
android.builtInKotlin=true
