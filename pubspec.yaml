name: teapodstream
description: "Android VPN client with three proxy cores (xray-core, xray-rust, sing-box) and strict split tunneling"
publish_to: 'none'
version: 1.8.0+10800

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.5.0

  # Storage
  shared_preferences: ^2.3.2
  # Stay on 10.x until at least 2027-01-17: 11 reads only data a 10.x release already migrated from 9.x
  # (EncryptedSharedPreferences); users updating straight from a 9.x build would lose their configs. See #191.
  flutter_secure_storage: ^10.3.4

  # Sharing
  share_plus: ^13.3.1

  # QR code scanning
  mobile_scanner: ^7.2.0

  # Networking
  http: ^1.2.2

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.3

  # Charts for speed graph
  fl_chart: ^1.2.0

  # Typography
  google_fonts: ^9.0.0

  # Permissions
  permission_handler: ^13.0.2
  package_info_plus: ^10.2.2
  url_launcher_android: ^6.3.33
  url_launcher: ^6.3.2
  path_provider: ^2.1.5
  socks5_proxy: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  fake_async: ^1.3.3
  args: ^2.7.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/binaries/
    - assets/licenses/
    - changelog/
